<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>WTA Tour Dashboard — official rankings, players, results &amp; statistics</title>

    <meta name="description" content="An independent, open-source dashboard for the Hologic WTA Tour. Official singles rankings, player profiles, career records, head-to-heads, tour calendar and season statistics — rebuilt from the WTA's own public data feed." />
    <meta name="theme-color" content="#0b0e13" />
    <meta name="color-scheme" content="dark" />
    <meta name="author" content="WTA Tour Dashboard contributors" />
    <meta name="robots" content="index, follow" />

    <meta property="og:type" content="website" />
    <meta property="og:title" content="WTA Tour Dashboard" />
    <meta property="og:description" content="Official WTA rankings, player records, head-to-heads and season statistics in one fast, open dashboard." />
    <meta property="og:locale" content="en_GB" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="WTA Tour Dashboard" />
    <meta name="twitter:description" content="Official WTA rankings, player records, head-to-heads and season statistics." />

    <link rel="icon" href="assets/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="assets/favicon.svg" />
    <link rel="stylesheet" href="assets/app.css" />
    <link rel="preconnect" href="https://wtafiles.blob.core.windows.net" crossorigin />
  </head>
  <body>
    <a class="skip" href="#main">Skip to content</a>

    <div id="app">
      <div class="page shell">
        <div style="padding:22vh 0;text-align:center">
          <div class="brand" style="justify-content:center;margin-bottom:18px">
            <span class="brand-mark"><span>W</span></span>
          </div>
          <div class="eyebrow">Loading official data</div>
        </div>
      </div>
    </div>

    <noscript>
      <div class="page shell">
        <div class="card"><div class="card-bd">
          <h2>JavaScript is required</h2>
          <p class="muted">This dashboard renders the official WTA ranking, player and
          tournament data client-side. Please enable JavaScript, or read the raw
          snapshots in the <code>data/</code> directory of the repository.</p>
        </div></div>
      </div>
    </noscript>

    <style>
      .skip {
        position: absolute;
        left: -9999px;
        top: 0;
        z-index: 999;
        background: var(--clay);
        color: #fff;
        padding: 10px 16px;
        border-radius: 3px;
      }
      .skip:focus {
        left: 12px;
        top: 12px;
      }
    </style>

    <script src="assets/build.js"></script>
    <script src="assets/h2h-data.js"></script>
    <script type="module" src="assets/app.js"></script>
  </body>
</html>
