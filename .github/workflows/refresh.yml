name: Refresh WTA data

# The WTA publishes new rankings on Mondays.  The weekly run refreshes the whole
# pipeline — rankings, the tournament registry, every draw, player records, the
# derived aggregates and the rebuilt site — because a rankings-only refresh leaves
# the results feed and every profile frozen at the last manual run.
#
# Manual runs are available from the Actions tab, with an option to use the plain
# build.py defaults instead.

on:
  schedule:
    # Mondays at 09:17 UTC — comfortably after the WTA publishes its list.
    - cron: '17 9 * * 1'
  workflow_dispatch:
    inputs:
      deep:
        description: 'Also refresh biographies, match logs and the calendar'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: refresh-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Weekly: full pipeline, with player records re-read (they never move on
      # their own).  A profile refresh is ~300 requests, hence the 120 min budget.
      - name: Weekly refresh
        if: ${{ github.event_name == 'schedule' || !inputs.deep }}
        run: python3 pyscripts/refresh_rankings.py

      - name: Full data refresh
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.deep }}
        env:
          WTA_WORKERS: '4'
          WTA_CONCURRENCY: '5'
        run: python3 pyscripts/build.py

      - name: Commit updated snapshots
        run: |
          git config user.name  'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A data docs
          if git diff --staged --quiet; then
            echo "No data changes this week."
          else
            AS_OF=$(python3 -c "import json;print(json.load(open('data/rankings-singles.json'))['asOf'][:10])")
            git commit -m "data: official WTA snapshot (${AS_OF})"
            git push
          fi
